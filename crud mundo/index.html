<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - CRUD Mundo</title>
</head>
<body>
    <div id="main">
        <div id="container">
            <h1>Explorador Geográfico</h1>
            <div class="cascata-container">
                <section class="coluna-lista">
                    <h2>Login</h2>
                    <form action="" method="post">
                        <ul>
                            <li>Nome: <input type="text" name="username" id="id-username"></li>
                            <li>Senha: <input type="password" name="user-password" id="id-user-password"></li>
                            <input type="submit" value="ENTRAR" id="btn-logar">
                        </ul>
                    </form>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
